name: XAUUSD signal scan

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:
    inputs:
      mode:
        description: 'scan / test / debug'
        default: 'scan'

concurrency:
  group: xau-signal
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Scan and alert
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          XAU_STATE: ${{ github.workspace }}/state.json
        run: |
          if [ "${{ inputs.mode }}" = "test" ]; then
            python xau_signal.py --test
          elif [ "${{ inputs.mode }}" = "debug" ]; then
            python xau_signal.py --debug
          else
            python xau_signal.py
          fi

      - name: Persist state / keepalive
        run: |
          git config user.name "xau-bot"
          git config user.email "actions@github.com"
          # heartbeat не чаще раза в сутки, чтобы репозиторий оставался "активным"
          if [ ! -f .heartbeat ] || [ $(( $(date +%s) - $(cat .heartbeat) )) -gt 72000 ]; then
            date +%s > .heartbeat
          fi
          if [ -n "$(git status --porcelain)" ]; then
            git add .heartbeat
            if [ -f state.json ]; then git add state.json; fi
            if ! git diff --cached --quiet; then
              git commit -m "state update [skip ci]"
              git push
            fi
          fi
